name: Deploy PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalovat závislosti
        run: npm install

      - name: Vytvořit PWA
        run: npm run build

      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrát PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publikovat na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4